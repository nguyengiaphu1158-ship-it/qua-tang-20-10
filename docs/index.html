<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Có một món quà nhỏ cho ngày 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0a12;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 90%;
        }

        .flower-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px auto;
            background: radial-gradient(circle, rgba(255,182,193,0.2) 0%, rgba(13,10,18,0) 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        .flower-icon::before {
            content: '🌷';
            font-size: 40px;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 105, 180, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(255, 105, 180, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 105, 180, 0.3); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #f3e5f5;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .btn-open {
            background: rgba(255, 105, 180, 0.15);
            border: 1px solid rgba(255, 182, 193, 0.4);
            color: #ffb6c1;
            padding: 10px 24px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
            outline: none;
        }

        .btn-open:active {
            transform: scale(0.95);
            background: rgba(255, 105, 180, 0.3);
        }

        .sub-text {
            position: absolute;
            bottom: 25px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        /* Giao diện nội dung khi bấm chạm mở quà */
        .card-content {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-p {
            font-size: 1rem;
            line-height: 1.8;
            color: #ffe4e1;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-screen">
        <div class="flower-icon"></div>
        <h1>Có một món quà nhỏ<br>cho ngày 20/10</h1>
        <button class="btn-open" onclick="openGift()">chạm để mở quà</button>
    </div>

    <!-- Màn hình sau khi bấm mở quà -->
    <div class="card-content" id="gift-screen">
        <div style="font-size: 2.5rem; margin-bottom: 15px;">💐✨</div>
        <p class="message-p">Chúc bạn một ngày 20/10 thật nhiều niềm vui, luôn rực rỡ, xinh đẹp và hạnh phúc nhé!</p>
        <p style="font-size: 0.85rem; color: #ffb6c1; margin-top: 15px;">Happy Vietnamese Women's Day! ❤️</p>
    </div>

    <div class="sub-text">bật âm thanh để nghe trọn vẹn nhé</div>

    <!-- Nhạc nền bài hát -->
    <audio id="bg-music" loop preload="auto">
        <source src="nhac.mp4" type="audio/mp4">
        <source src="https://huyndcv.github.io/20102026/ltt/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        function openGift() {
            var music = document.getElementById('bg-music');
            music.play().catch(function(e) {
                console.log("Autoplay blocked");
            });

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('gift-screen').style.display = 'block';
        }
    </script>
</body>
</html>
